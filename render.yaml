services:
  - type: web
    name: crypto-telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: CRYPTO_ADDRESS
        sync: false
      - key: ADMIN_PANEL_PORT
        value: 5000
