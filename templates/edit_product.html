{% extends "base.html" %}

{% block title %}Edit Product - Crypto Store Admin{% endblock %}

{% block content %}
<h1>Edit Product</h1>

<div class="card">
    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="name">Product Name *</label>
            <input type="text" id="name" name="name" value="{{ product.name }}" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description">{{ product.description or '' }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="price">Price (in crypto) *</label>
            <input type="number" id="price" name="price" step="0.00000001" value="{{ product.price }}" required>
        </div>
        
        <div class="form-group">
            <label for="image">Product Image</label>
            {% if product.image_path %}
                <div style="margin-bottom: 10px;">
                    <img src="/{{ product.image_path }}" style="max-width: 200px; height: auto; border-radius: 5px;" alt="{{ product.name }}">
                    <p style="font-size: 12px; color: #666;">Current image (upload new to replace)</p>
                </div>
            {% endif %}
            <input type="file" id="image" name="image" accept="image/*">
        </div>
        
        <button type="submit" class="btn btn-success">💾 Update Product</button>
        <a href="/products" class="btn btn-danger">❌ Cancel</a>
    </form>
</div>
{% endblock %}
